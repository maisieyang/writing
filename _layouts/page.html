---
layout: default
---

<div class="article-shell">
  {% include article-nav.html %}

  <article class="post">
    <header class="article-header">
      <h1 class="article-title">{{ page.title | escape }}</h1>

      {% if page.article_summary %}
        <p class="article-summary">{{ page.article_summary | escape }}</p>
      {% endif %}
    </header>

    <div class="post-content prose">
      {{ content }}
    </div>
  </article>
</div>
